<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gitmum</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ff0055">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>▶</text></svg>">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Roboto', Arial, sans-serif;
      background-color: #0f0f0f;
      color: #f1f1f1;
      padding: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid #272727;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.6rem;
      font-weight: 700;
      cursor: pointer;
    }
    .logo-icon {
      background: #ff0055;
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .install-btn {
      background: #ff0055;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    /* Offline Banner Notice */
    #offlineNotice {
      display: none;
      background: #2a151b;
      border: 1px solid #ff0055;
      color: #ff80a5;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 20px;
    }
    .offline-icon {
      font-size: 2.5rem;
      margin-bottom: 5px;
    }

    .player-section {
      display: none;
      grid-template-columns: 1fr 350px;
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto 40px auto;
    }
    @media (max-width: 1000px) {
      .player-section {
        grid-template-columns: 1fr;
      }
    }

    .main-video-box {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }
    video#mainPlayer {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      pointer-events: none;
    }

    .main-details {
      margin-top: 15px;
    }
    .main-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .player-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #212121;
      padding: 10px 15px;
      border-radius: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .inapp-download-btn {
      background: #272727;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .progress-bar {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 3px;
      background: #4c4c4c;
      outline: none;
      cursor: pointer;
    }
    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff0055;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: #0f0f0f;
      border-radius: 12px;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
    }
    .card-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #1e1e1e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #ff0055;
    }
    .card-info {
      padding: 10px 4px;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-status-badge {
      font-size: 0.75rem;
      color: #00ff88;
      margin-top: 4px;
    }

    #status {
      text-align: center;
      grid-column: 1 / -1;
      color: #aaa;
      margin-top: 40px;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <header>
    <div class="logo" onclick="closePlayer()">
      <span class="logo-icon">▶</span> gitmum
    </div>
    <button class="install-btn" id="installBtn">Install App</button>
  </header>

  <!-- Offline Network Overlay Banner -->
  <div id="offlineNotice">
    <div class="offline-icon">📡❌</div>
    <h3>No Connection</h3>
    <p>Showing in-app downloaded media. Network feature updates will resume when online.</p>
  </div>

  <div class="player-section" id="playerSection">
    <div>
      <div class="main-video-box">
        <video id="mainPlayer" preload="metadata" controlsList="nodownload noremoteplayback"></video>
      </div>
      <div class="main-details">
        <h2 class="main-title" id="mainTitle">Track Title</h2>
        <div class="player-controls">
          <button class="btn" id="playBtn" onclick="togglePlay()">▶</button>
          <input type="range" class="progress-bar" id="seekBar" value="0" min="0" max="100" oninput="seekVideo(this.value)">
          <button class="btn" id="muteBtn" onclick="toggleMute()">🔊</button>
          <button class="inapp-download-btn" id="downloadAppBtn" onclick="downloadTrackLocally()">💾 Save Offline</button>
        </div>
      </div>
    </div>
    
    <div id="sidebarList">
      <h3 style="margin-bottom: 15px; font-size: 1.1rem;">Up Next</h3>
      <div id="nextContainer" style="display: flex; flex-direction: column; gap: 15px;"></div>
    </div>
  </div>

  <main class="grid" id="songContainer">
    <p id="status">Loading videos...</p>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW failed:', err));
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          installBtn.style.display = 'none';
        });
      }
    });

    const username = 'huzaifafaraz67-sketch';
    const repoName = 'gitmum';
    const apiUrl = `https://api.github.com/repos/${username}/${repoName}/contents/`;

    const container = document.getElementById('songContainer');
    const playerSection = document.getElementById('playerSection');
    const mainPlayer = document.getElementById('mainPlayer');
    const mainTitle = document.getElementById('mainTitle');
    const playBtn = document.getElementById('playBtn');
    const muteBtn = document.getElementById('muteBtn');
    const seekBar = document.getElementById('seekBar');
    const offlineNotice = document.getElementById('offlineNotice');
    const downloadAppBtn = document.getElementById('downloadAppBtn');

    let currentFileUrl = '';
    let currentTitleClean = '';
    let allFiles = [];

    // Offline / Online network state handlers
    function updateNetworkStatus() {
      if (!navigator.onLine) {
        offlineNotice.style.display = 'block';
        loadOfflineTracks();
      } else {
        offlineNotice.style.display = 'none';
        fetchOnlineTracks();
      }
    }

    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);

    // Load from GitHub API when online
    function fetchOnlineTracks() {
      fetch(apiUrl)
        .then(res => res.json())
        .then(data => {
          allFiles = data.filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.mp4'));
          renderGrid(allFiles);
        })
        .catch(() => loadOfflineTracks());
    }

    // Load saved tracks from Cache Storage when offline
    async function loadOfflineTracks() {
      const cache = await caches.open('gitmum-media');
      const keys = await cache.keys();
      
      if (keys.length === 0) {
        container.innerHTML = '<p id="status">No internet connection and no in-app downloaded tracks saved.</p>';
        return;
      }

      container.innerHTML = '';
      keys.forEach(request => {
        const url = request.url;
        const filename = url.substring(url.lastIndexOf('/') + 1);
        const cleanTitle = decodeURIComponent(filename).replace(/\.mp4$/i, '');

        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openVideo(url, cleanTitle);

        card.innerHTML = `
          <div class="card-thumb">▶</div>
          <div class="card-info">
            <div class="card-title">${cleanTitle}</div>
            <div class="card-status-badge">⚡ Downloaded Offline</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderGrid(files) {
      if (files.length === 0) {
        container.innerHTML = '<p id="status">No MP4 files found.</p>';
        return;
      }
      container.innerHTML = '';
      files.forEach(file => {
        const cleanTitle = file.name.replace(/\.mp4$/i, '');
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openVideo(file.download_url, cleanTitle);

        card.innerHTML = `
          <div class="card-thumb">▶</div>
          <div class="card-info">
            <div class="card-title">${cleanTitle}</div>
            <div class="card-author">gitmum • Funk</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Download video directly to App Storage
    async function downloadTrackLocally() {
      if (!currentFileUrl) return;
      downloadAppBtn.innerText = '⏳ Downloading...';
      try {
        const cache = await caches.open('gitmum-media');
        await cache.add(currentFileUrl);
        downloadAppBtn.innerText = '✓ Saved in App';
      } catch (err) {
        downloadAppBtn.innerText = '❌ Failed';
      }
    }

    async function checkSavedState(url) {
      const cache = await caches.open('gitmum-media');
      const match = await cache.match(url);
      if (match) {
        downloadAppBtn.innerText = '✓ Saved in App';
      } else {
        downloadAppBtn.innerText = '💾 Save Offline';
      }
    }

    function openVideo(url, title) {
      currentFileUrl = url;
      currentTitleClean = title;
      mainPlayer.src = url;
      mainTitle.innerText = title;
      playerSection.style.display = 'grid';
      window.scrollTo({ top: 0, behavior: 'smooth' });

      checkSavedState(url);
      safePlay();
    }

    function closePlayer() {
      mainPlayer.pause();
      playerSection.style.display = 'none';
    }

    function safePlay() {
      const playPromise = mainPlayer.play();
      if (playPromise !== undefined) {
        playPromise.then(() => playBtn.innerText = '❚❚').catch(() => playBtn.innerText = '▶');
      }
    }

    function togglePlay() {
      if (mainPlayer.paused) { safePlay(); } else { mainPlayer.pause(); playBtn.innerText = '▶'; }
    }

    function toggleMute() {
      mainPlayer.muted = !mainPlayer.muted;
      muteBtn.innerText = mainPlayer.muted ? '🔇' : '🔊';
    }

    function seekVideo(val) {
      if (mainPlayer.duration) mainPlayer.currentTime = (val / 100) * mainPlayer.duration;
    }

    mainPlayer.addEventListener('timeupdate', () => {
      if (mainPlayer.duration) seekBar.value = (mainPlayer.currentTime / mainPlayer.duration) * 100;
    });

    // Initialize network status on startup
    updateNetworkStatus();
  </script>
</body>
</html>
