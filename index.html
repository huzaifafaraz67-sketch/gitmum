<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>gitmum - Next Level Hub</title>

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ff0055">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- SVG Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #08080a;
      --bg-card: rgba(20, 20, 28, 0.7);
      --accent: #ff0055;
      --accent-glow: rgba(255, 0, 85, 0.45);
      --accent-alt: #7928ca;
      --text-main: #f8f9fa;
      --text-muted: #a1a1aa;
      --glass-border: rgba(255, 255, 255, 0.08);
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 0, 85, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(121, 40, 202, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
      padding-bottom: 120px;
    }

    header {
      position: sticky;
      top: 15px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: rgba(15, 15, 20, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      cursor: pointer;
    }

    .logo-badge {
      background: linear-gradient(135deg, var(--accent), var(--accent-alt));
      color: #fff;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 1rem;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .install-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-alt));
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: none;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    /* Modern Video Player Layout */
    .player-section {
      display: none;
      grid-template-columns: 1fr;
      max-width: 1100px;
      margin: 0 auto 40px auto;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .player-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      position: relative;
    }

    .main-video-box {
      background: #000;
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 30px var(--accent-glow);
      border: 1px solid rgba(255, 0, 85, 0.3);
    }

    video#mainPlayer {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      cursor: pointer;
    }

    .main-details {
      margin-top: 20px;
    }

    .main-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Custom Player Control Suite */
    .custom-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(10, 10, 15, 0.8);
      padding: 16px 20px;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-stamp {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      min-width: 45px;
    }

    .progress-bar {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      cursor: pointer;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-circle {
      background: linear-gradient(135deg, var(--accent), var(--accent-alt));
      border: none;
      color: #fff;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: transform 0.2s;
    }

    .btn-circle:active {
      transform: scale(0.9);
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .save-offline-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 22px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s, border-color 0.25s;
      backdrop-filter: blur(10px);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255, 0, 85, 0.4);
    }

    .card-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #181824, #101018);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-overlay {
      width: 50px;
      height: 50px;
      background: rgba(255, 0, 85, 0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .card-info {
      padding: 16px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .card-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    #status {
      text-align: center;
      grid-column: 1 / -1;
      color: var(--text-muted);
      font-size: 1.1rem;
      padding: 60px 0;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <header>
    <div class="logo" onclick="closePlayer()">
      <div class="logo-badge">⚡</div>
      <span>gitmum</span>
    </div>
    <button class="install-btn" id="installBtn">⚡ Install App</button>
  </header>

  <div class="player-section" id="playerSection">
    <div class="player-card">
      <div class="main-video-box">
        <video id="mainPlayer" onclick="togglePlay()"></video>
      </div>
      <div class="main-details">
        <h2 class="main-title" id="mainTitle">Track Title</h2>
        
        <!-- Custom Controls Suite -->
        <div class="custom-controls">
          <div class="progress-container">
            <span class="time-stamp" id="currentTime">0:00</span>
            <input type="range" class="progress-bar" id="seekBar" value="0" min="0" max="100" oninput="seekVideo(this.value)">
            <span class="time-stamp" id="durationTime">0:00</span>
          </div>
          
          <div class="controls-row">
            <div class="controls-left">
              <button class="btn-circle" id="playBtn" onclick="togglePlay()">▶</button>
              <button class="btn-icon" onclick="skipTime(-10)">⏪</button>
              <button class="btn-icon" onclick="skipTime(10)">⏩</button>
              <button class="btn-icon" id="muteBtn" onclick="toggleMute()">🔊</button>
            </div>
            
            <div class="controls-right">
              <button class="save-offline-btn" id="downloadAppBtn" onclick="downloadTrackLocally()">💾 Save Offline</button>
              <button class="btn-icon" onclick="toggleFullscreen()">⛶</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <main class="grid" id="songContainer">
    <p id="status">Syncing library...</p>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .catch(err => console.error('SW Error:', err));
      });
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          installBtn.style.display = 'none';
          deferredPrompt = null;
        });
      }
    });

    const username = 'huzaifafaraz67-sketch';
    const repoName = 'gitmum';
    const apiUrl = `https://api.github.com/repos/${username}/${repoName}/contents/`;

    const container = document.getElementById('songContainer');
    const playerSection = document.getElementById('playerSection');
    const mainPlayer = document.getElementById('mainPlayer');
    const mainTitle = document.getElementById('mainTitle');
    const playBtn = document.getElementById('playBtn');
    const muteBtn = document.getElementById('muteBtn');
    const seekBar = document.getElementById('seekBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const downloadAppBtn = document.getElementById('downloadAppBtn');

    let currentFileUrl = '';

    function fetchTracks() {
      fetch(apiUrl)
        .then(res => res.json())
        .then(data => {
          const files = data.filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.mp4'));
          renderGrid(files);
        })
        .catch(() => {
          container.innerHTML = '<p id="status">Error loading videos from repo.</p>';
        });
    }

    function renderGrid(files) {
      if (files.length === 0) {
        container.innerHTML = '<p id="status">No MP4 files found.</p>';
        return;
      }
      container.innerHTML = '';
      files.forEach(file => {
        const cleanTitle = file.name.replace(/\.mp4$/i, '');
        const relativeUrl = `./${encodeURIComponent(file.name)}`;

        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openVideo(relativeUrl, cleanTitle);

        card.innerHTML = `
          <div class="card-thumb">
            <div class="play-overlay">▶</div>
          </div>
          <div class="card-info">
            <div class="card-title">${cleanTitle}</div>
            <div class="card-meta">gitmum • Funk</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openVideo(url, title) {
      currentFileUrl = url;
      mainTitle.innerText = title;
      mainPlayer.src = url;
      playerSection.style.display = 'grid';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      safePlay();
    }

    function closePlayer() {
      mainPlayer.pause();
      playerSection.style.display = 'none';
    }

    function safePlay() {
      mainPlayer.play().then(() => playBtn.innerText = '❚❚').catch(() => playBtn.innerText = '▶');
    }

    function togglePlay() {
      if (mainPlayer.paused) { safePlay(); } else { mainPlayer.pause(); playBtn.innerText = '▶'; }
    }

    function toggleMute() {
      mainPlayer.muted = !mainPlayer.muted;
      muteBtn.innerText = mainPlayer.muted ? '🔇' : '🔊';
    }

    function skipTime(val) {
      mainPlayer.currentTime += val;
    }

    function seekVideo(val) {
      if (mainPlayer.duration) mainPlayer.currentTime = (val / 100) * mainPlayer.duration;
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        mainPlayer.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen();
      }
    }

    function formatTime(sec) {
      if (isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    mainPlayer.addEventListener('timeupdate', () => {
      if (mainPlayer.duration) {
        seekBar.value = (mainPlayer.currentTime / mainPlayer.duration) * 100;
        currentTimeEl.innerText = formatTime(mainPlayer.currentTime);
        durationTimeEl.innerText = formatTime(mainPlayer.duration);
      }
    });

    async function downloadTrackLocally() {
      if (!currentFileUrl) return;
      downloadAppBtn.innerText = '⏳ Saving...';
      try {
        const cache = await caches.open('gitmum-media');
        await cache.add(currentFileUrl);
        downloadAppBtn.innerText = '✓ Saved Offline';
      } catch (err) {
        downloadAppBtn.innerText = '❌ Failed';
      }
    }

    fetchTracks();
  </script>
</body>
</html>
