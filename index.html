<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gitmum - Funk Tracks</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0c10;
      color: #fff;
      padding: 30px 20px;
    }
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    h1 {
      font-size: 3rem;
      color: #ff0055;
      text-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
      letter-spacing: 2px;
    }
    p.subtitle {
      color: #888;
      font-size: 1.1rem;
      margin-top: 5px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
      max-width: 1300px;
      margin: 0 auto;
    }
    
    /* Modernized Card */
    .card {
      background: #14161d;
      border: 1px solid #222634;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: #ff0055;
    }
    .card h3 {
      font-size: 1rem;
      font-weight: 600;
      color: #e0e0e0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Video & Container */
    .video-wrapper {
      position: relative;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    video {
      width: 100%;
      display: block;
      aspect-ratio: 16/9;
      object-fit: cover;
    }

    /* Custom Controls Bar */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1c1f2b;
      padding: 8px 12px;
      border-radius: 6px;
    }
    .btn {
      background: none;
      border: none;
      color: #ff0055;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .btn:hover {
      background: rgba(255, 0, 85, 0.15);
    }
    
    /* Custom Progress Bar */
    .progress-bar {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 3px;
      background: #333748;
      outline: none;
      cursor: pointer;
    }
    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff0055;
      cursor: pointer;
    }
    
    #status {
      text-align: center;
      grid-column: 1 / -1;
      color: #888;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>gitmum</h1>
    <p class="subtitle">Your Funk Media Hub</p>
  </header>

  <main class="grid" id="songContainer">
    <p id="status">Loading tracks...</p>
  </main>

  <script>
    const username = 'huzaifafaraz67-sketch';
    const repoName = 'gitmum';
    const apiUrl = `https://api.github.com/repos/${username}/${repoName}/contents/`;
    const container = document.getElementById('songContainer');

    fetch(apiUrl)
      .then(res => {
        if (!res.ok) throw new Error('Failed to fetch files');
        return res.json();
      })
      .then(data => {
        const mp4Files = data.filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.mp4'));

        if (mp4Files.length === 0) {
          container.innerHTML = '<p id="status">No MP4 files found in the root directory.</p>';
          return;
        }

        container.innerHTML = '';

        mp4Files.forEach((file, id) => {
          const cleanTitle = file.name.replace(/\.mp4$/i, '');
          const card = document.createElement('div');
          card.className = 'card';

          card.innerHTML = `
            <h3 title="${cleanTitle}">${cleanTitle}</h3>
            <div class="video-wrapper">
              <video id="vid-${id}" preload="metadata">
                <source src="${file.download_url}" type="video/mp4">
              </video>
            </div>
            <div class="controls">
              <button class="btn" onclick="togglePlay('vid-${id}', this)">▶</button>
              <input type="range" class="progress-bar" id="seek-${id}" value="0" min="0" max="100" oninput="seekVideo('vid-${id}', this.value)">
              <button class="btn" onclick="toggleMute('vid-${id}', this)">🔊</button>
            </div>
          `;
          container.appendChild(card);

          // Track progress setup
          const vid = document.getElementById(`vid-${id}`);
          const seek = document.getElementById(`seek-${id}`);

          vid.addEventListener('timeupdate', () => {
            if (vid.duration) {
              seek.value = (vid.currentTime / vid.duration) * 100;
            }
          });
        });
      })
      .catch(err => {
        console.error(err);
        container.innerHTML = '<p id="status">Error loading MP4 files.</p>';
      });

    // Custom Control Functions
    function togglePlay(id, btn) {
      const vid = document.getElementById(id);
      if (vid.paused) {
        vid.play();
        btn.innerText = '❚❚';
      } else {
        vid.pause();
        btn.innerText = '▶';
      }
    }

    function toggleMute(id, btn) {
      const vid = document.getElementById(id);
      vid.muted = !vid.muted;
      btn.innerText = vid.muted ? '🔇' : '🔊';
    }

    function seekVideo(id, value) {
      const vid = document.getElementById(id);
      if (vid.duration) {
        vid.currentTime = (value / 100) * vid.duration;
      }
    }
  </script>

</body>
</html>
