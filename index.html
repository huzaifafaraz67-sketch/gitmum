<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>gitmum</title>

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#e95420">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Ubuntu Vector Favicon -->
  <link id="dynamicFavicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23e95420'/><circle cx='50' cy='50' r='24' fill='none' stroke='%23ffffff' stroke-width='7'/><circle cx='50' cy='20' r='8' fill='%23ffffff'/><circle cx='24' cy='65' r='8' fill='%23ffffff'/><circle cx='76' cy='65' r='8' fill='%23ffffff'/></svg>">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07070a;
      --bg-card: rgba(18, 18, 26, 0.75);
      --accent: #e95420;
      --accent-glow: rgba(233, 84, 32, 0.5);
      --accent-alt: #77216f;
      --text-main: #f8f9fa;
      --text-muted: #8e8e99;
      --glass-border: rgba(255, 255, 255, 0.1);
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 10%, rgba(233, 84, 32, 0.18) 0px, transparent 40%),
        radial-gradient(at 90% 90%, rgba(119, 33, 111, 0.18) 0px, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px;
      padding-bottom: 120px;
    }

    header {
      position: sticky;
      top: 15px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      background: rgba(12, 12, 18, 0.8);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      margin-bottom: 35px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      cursor: pointer;
    }

    .logo-badge {
      background: linear-gradient(135deg, var(--accent), var(--accent-alt));
      color: #fff;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .svg-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .install-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-alt));
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: none;
      box-shadow: 0 4px 20px var(--accent-glow);
      transition: transform 0.2s;
    }

    .install-btn:active {
      transform: scale(0.95);
    }

    .player-section {
      display: none;
      grid-template-columns: 1fr;
      max-width: 1100px;
      margin: 0 auto 40px auto;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .player-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      backdrop-filter: blur(30px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.7);
    }

    .main-video-box {
      background: #000;
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 35px var(--accent-glow);
      border: 1px solid rgba(233, 84, 32, 0.3);
    }

    video#mainPlayer {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      cursor: pointer;
    }

    .main-details {
      margin-top: 20px;
    }

    .main-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .custom-controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: rgba(8, 8, 12, 0.85);
      padding: 18px 22px;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .time-stamp {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      min-width: 45px;
    }

    .progress-bar {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      cursor: pointer;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-circle {
      background: linear-gradient(135deg, var(--accent), var(--accent-alt));
      border: none;
      color: #fff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 18px var(--accent-glow);
      transition: transform 0.2s;
    }

    .btn-circle:active {
      transform: scale(0.9);
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-icon:active {
      transform: scale(0.92);
    }

    .save-offline-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .save-offline-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
      backdrop-filter: blur(15px);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(233, 84, 32, 0.4);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .card-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #14141f, #0c0c14);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-overlay {
      width: 52px;
      height: 52px;
      background: rgba(233, 84, 32, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 0 25px var(--accent-glow);
    }

    .card-info {
      padding: 18px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .card-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    #status {
      text-align: center;
      grid-column: 1 / -1;
      color: var(--text-muted);
      font-size: 1.1rem;
      padding: 60px 0;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <header>
    <div class="logo" onclick="closePlayer()">
      <div class="logo-badge">
        <svg class="svg-icon" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="24" fill="none" stroke="#ffffff" stroke-width="8"/>
          <circle cx="50" cy="18" r="9" fill="#ffffff"/>
          <circle cx="22" cy="66" r="9" fill="#ffffff"/>
          <circle cx="78" cy="66" r="9" fill="#ffffff"/>
        </svg>
      </div>
      <span>gitmum</span>
    </div>
    <button class="install-btn" id="installBtn">Install App</button>
  </header>

  <div class="player-section" id="playerSection">
    <div class="player-card">
      <div class="main-video-box">
        <video id="mainPlayer" onclick="togglePlay()"></video>
      </div>
      <div class="main-details">
        <h2 class="main-title" id="mainTitle">Track Title</h2>
        
        <div class="custom-controls">
          <div class="progress-container">
            <span class="time-stamp" id="currentTime">0:00</span>
            <input type="range" class="progress-bar" id="seekBar" value="0" min="0" max="100" oninput="seekVideo(this.value)">
            <span class="time-stamp" id="durationTime">0:00</span>
          </div>
          
          <div class="controls-row">
            <div class="controls-left">
              <button class="btn-circle" id="playBtn" onclick="togglePlay()">
                <svg class="svg-icon" id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </button>
              <button class="btn-icon" onclick="skipTime(-10)">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
              </button>
              <button class="btn-icon" onclick="skipTime(10)">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
              </button>
              <button class="btn-icon" id="muteBtn" onclick="toggleMute()">
                <svg class="svg-icon" id="muteIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
              </button>
            </div>
            
            <div class="controls-right">
              <button class="save-offline-btn" id="downloadAppBtn" onclick="downloadTrackLocally()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                <span id="saveBtnText">Save Offline</span>
              </button>
              <button class="btn-icon" onclick="toggleFullscreen()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <main class="grid" id="songContainer">
    <p id="status">Syncing library...</p>
  </main>

  <script>
    // Force browser tab to reload the Ubuntu icon dynamically
    (function forceFaviconRefresh() {
      const svgIcon = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23e95420'/><circle cx='50' cy='50' r='24' fill='none' stroke='%23ffffff' stroke-width='7'/><circle cx='50' cy='20' r='8' fill='%23ffffff'/><circle cx='24' cy='65' r='8' fill='%23ffffff'/><circle cx='76' cy='65' r='8' fill='%23ffffff'/></svg>`;
      const link = document.getElementById('dynamicFavicon');
      if (link) {
        link.remove();
      }
      const newLink = document.createElement('link');
      newLink.id = 'dynamicFavicon';
      newLink.rel = 'icon';
      newLink.type = 'image/svg+xml';
      newLink.href = 'data:image/svg+xml;utf8,' + svgIcon + '?v=' + Date.now();
      document.getElementsByTagName('head')[0].appendChild(newLink);
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(reg => { reg.update(); })
          .catch(err => console.error('SW Error:', err));
      });
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          installBtn.style.display = 'none';
          deferredPrompt = null;
        });
      }
    });

    const username = 'huzaifafaraz67-sketch';
    const repoName = 'gitmum';
    const apiUrl = `https://api.github.com/repos/${username}/${repoName}/contents/`;

    const container = document.getElementById('songContainer');
    const playerSection = document.getElementById('playerSection');
    const mainPlayer = document.getElementById('mainPlayer');
    const mainTitle = document.getElementById('mainTitle');
    const playIcon = document.getElementById('playIcon');
    const muteIcon = document.getElementById('muteIcon');
    const seekBar = document.getElementById('seekBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const saveBtnText = document.getElementById('saveBtnText');

    let currentFileUrl = '';

    const iconPlay = 'M8 5v14l11-7z';
    const iconPause = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';
    const iconVolOn = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z';
    const iconVolMute = 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';

    function fetchTracks() {
      fetch(apiUrl)
        .then(res => res.json())
        .then(data => {
          const files = data.filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.mp4'));
          renderGrid(files);
        })
        .catch(() => {
          container.innerHTML = '<p id="status">Error loading videos from repo.</p>';
        });
    }

    function renderGrid(files) {
      if (files.length === 0) {
        container.innerHTML = '<p id="status">No MP4 files found.</p>';
        return;
      }
      container.innerHTML = '';
      files.forEach(file => {
        const cleanTitle = file.name.replace(/\.mp4$/i, '');
        const relativeUrl = `./${encodeURIComponent(file.name)}`;

        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openVideo(relativeUrl, cleanTitle);

        card.innerHTML = `
          <div class="card-thumb">
            <div class="play-overlay">
              <svg class="svg-icon" viewBox="0 0 24 24"><path d="${iconPlay}"/></svg>
            </div>
          </div>
          <div class="card-info">
            <div class="card-title">${cleanTitle}</div>
            <div class="card-meta">gitmum • Media</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openVideo(url, title) {
      currentFileUrl = url;
      mainTitle.innerText = title;
      mainPlayer.src = url;
      playerSection.style.display = 'grid';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      safePlay();
    }

    function closePlayer() {
      mainPlayer.pause();
      playerSection.style.display = 'none';
    }

    function safePlay() {
      mainPlayer.play().then(() => {
        playIcon.setAttribute('d', iconPause);
      }).catch(() => {
        playIcon.setAttribute('d', iconPlay);
      });
    }

    function togglePlay() {
      if (mainPlayer.paused) {
        safePlay();
      } else {
        mainPlayer.pause();
        playIcon.setAttribute('d', iconPlay);
      }
    }

    function toggleMute() {
      mainPlayer.muted = !mainPlayer.muted;
      muteIcon.setAttribute('d', mainPlayer.muted ? iconVolMute : iconVolOn);
    }

    function skipTime(val) {
      mainPlayer.currentTime += val;
    }

    function seekVideo(val) {
      if (mainPlayer.duration) mainPlayer.currentTime = (val / 100) * mainPlayer.duration;
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        mainPlayer.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen();
      }
    }

    function formatTime(sec) {
      if (isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    mainPlayer.addEventListener('timeupdate', () => {
      if (mainPlayer.duration) {
        seekBar.value = (mainPlayer.currentTime / mainPlayer.duration) * 100;
        currentTimeEl.innerText = formatTime(mainPlayer.currentTime);
        durationTimeEl.innerText = formatTime(mainPlayer.duration);
      }
    });

    async function downloadTrackLocally() {
      if (!currentFileUrl) return;
      saveBtnText.innerText = 'Saving...';
      try {
        const cache = await caches.open('gitmum-media');
        await cache.add(currentFileUrl);
        saveBtnText.innerText = 'Saved Offline';
      } catch (err) {
        saveBtnText.innerText = 'Failed';
      }
    }

    fetchTracks();
  </script>
</body>
</html>
