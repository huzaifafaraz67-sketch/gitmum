<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gitmum - Funk Tracks</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      font-size: 2.5rem;
      color: #ff0055;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }
    .card h3 {
      font-size: 1rem;
      margin-bottom: 10px;
      word-break: break-all;
    }
    video {
      width: 100%;
      border-radius: 5px;
    }
    #status {
      text-align: center;
      grid-column: 1 / -1;
      color: #aaa;
    }
  </style>
</head>
<body>

  <header>
    <h1>gitmum</h1>
    <p>Your Funk Media Hub</p>
  </header>

  <main class="grid" id="songContainer">
    <p id="status">Loading tracks...</p>
  </main>

  <script>
    // GitHub repository details
    const username = 'huzaifafaraz67-sketch';
    const repoName = 'gitmum';

    const apiUrl = `https://api.github.com/repos/${username}/${repoName}/contents/`;
    const container = document.getElementById('songContainer');

    fetch(apiUrl)
      .then(response => {
        if (!response.ok) throw new Error('Failed to fetch repo contents');
        return response.json();
      })
      .then(data => {
        // Find files ending in .mp4 (case-insensitive)
        const mp4Files = data.filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.mp4'));

        if (mp4Files.length === 0) {
          container.innerHTML = '<p id="status">No MP4 files found in the root directory.</p>';
          return;
        }

        container.innerHTML = ''; // Clear loading message

        // Generate video player cards
        mp4Files.forEach(file => {
          const card = document.createElement('div');
          card.className = 'card';

          card.innerHTML = `
            <h3>${file.name}</h3>
            <video controls preload="metadata">
              <source src="${file.download_url}" type="video/mp4">
              Your browser does not support playing this video.
            </video>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        console.error(err);
        container.innerHTML = '<p id="status">Error loading MP4 files. Check console for details.</p>';
      });
  </script>

</body>
</html>
