<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gitmum</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none; /* Prevents text and media selection */
      -webkit-user-select: none;
    }
    body {
      font-family: 'Roboto', Arial, sans-serif;
      background-color: #0f0f0f; /* YouTube Dark Mode Background */
      color: #f1f1f1;
      padding: 20px;
    }
    
    /* YouTube Style Header */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid #272727;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo-icon {
      background: #ff0055;
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 1.2rem;
    }
    
    /* YouTube Style Video Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    /* YouTube Video Card */
    .card {
      background: #0f0f0f;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
    }
    
    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none; /* Prevents right clicking directly on video element */
    }
    
    .video-info {
      display: flex;
      gap: 12px;
      padding: 0 4px;
    }
    .channel-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ff0055;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }
    .video-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.3;
      color: #f1f1f1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .channel-name {
      font-size: 0.8rem;
      color: #aaa;
    }
    
    /* Custom Controls Overlay */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #212121;
      padding: 8px 12px;
      border-radius: 8px;
      margin-top: 4px;
    }
    .btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }
    .btn:hover {
      background: #383838;
    }
    .progress-bar {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: #4c4c4c;
      outline: none;
      cursor: pointer;
    }
    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff0055;
    }

    #status {
      text-align: center;
      grid-column: 1 / -1;
      color: #aaa;
      margin-top: 40px;
    }
  </style>
</head>
<body oncontextmenu="return false;"> <!-- Right Click Blocked -->

  <header>
    <div class="logo">
      <span class="logo-icon">▶</span> gitmum
    </div>
  </header>

  <main class="grid" id="songContainer">
    <p id="status">Loading videos...</p>
  </main>

  <script>
    const username = 'huzaifafaraz67-sketch';
    const repoName = 'gitmum';
    const apiUrl = `https://api.github.com/repos/${username}/${repoName}/contents/`;
    const container = document.getElementById('songContainer');

    // 1. Block Keyboard Shortcuts for Saving/Inspecting
    document.addEventListener('keydown', (e) => {
      // Block Ctrl+S, Ctrl+U, Ctrl+Shift+I, F12
      if (
        (e.ctrlKey && (e.key === 's' || e.key === 'u')) || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) ||
        e.key === 'F12'
      ) {
        e.preventDefault();
      }
    });

    // 2. Fetch Repo Contents
    fetch(apiUrl)
      .then(res => {
        if (!res.ok) throw new Error('Failed to fetch files');
        return res.json();
      })
      .then(data => {
        const mp4Files = data.filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.mp4'));

        if (mp4Files.length === 0) {
          container.innerHTML = '<p id="status">No videos found.</p>';
          return;
        }

        container.innerHTML = '';

        mp4Files.forEach((file, id) => {
          const cleanTitle = file.name.replace(/\.mp4$/i, '');
          const card = document.createElement('div');
          card.className = 'card';

          card.innerHTML = `
            <div class="video-container">
              <!-- nodownload & noremoteplayback attributes -->
              <video id="vid-${id}" preload="metadata" controlsList="nodownload noremoteplayback">
                <source src="${file.download_url}" type="video/mp4">
              </video>
            </div>
            <div class="video-info">
              <div class="channel-avatar">G</div>
              <div class="details">
                <div class="video-title" title="${cleanTitle}">${cleanTitle}</div>
                <div class="channel-name">gitmum • Funk</div>
              </div>
            </div>
            <div class="controls">
              <button class="btn" onclick="togglePlay('vid-${id}', this)">▶</button>
              <input type="range" class="progress-bar" id="seek-${id}" value="0" min="0" max="100" oninput="seekVideo('vid-${id}', this.value)">
              <button class="btn" onclick="toggleMute('vid-${id}', this)">🔊</button>
            </div>
          `;
          container.appendChild(card);

          // Update seek bar during playback
          const vid = document.getElementById(`vid-${id}`);
          const seek = document.getElementById(`seek-${id}`);

          vid.addEventListener('timeupdate', () => {
            if (vid.duration) {
              seek.value = (vid.currentTime / vid.duration) * 100;
            }
          });
        });
      })
      .catch(err => {
        console.error(err);
        container.innerHTML = '<p id="status">Error loading videos.</p>';
      });

    // Video Controls
    function togglePlay(id, btn) {
      const vid = document.getElementById(id);
      if (vid.paused) {
        vid.play();
        btn.innerText = '❚❚';
      } else {
        vid.pause();
        btn.innerText = '▶';
      }
    }

    function toggleMute(id, btn) {
      const vid = document.getElementById(id);
      vid.muted = !vid.muted;
      btn.innerText = vid.muted ? '🔇' : '🔊';
    }

    function seekVideo(id, value) {
      const vid = document.getElementById(id);
      if (vid.duration) {
        vid.currentTime = (value / 100) * vid.duration;
      }
    }
  </script>

</body>
</html>
